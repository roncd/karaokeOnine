# Dev rapide : pas de rebuild à chaque changement de code.
# Usage :
#   docker compose down
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Ouvrir : http://localhost:8081
services:
  backend:
    build:
      target: runtime
    image: karaoke-backend:dev
    pull_policy: never
    volumes:
      - ./backend/src:/app/src
      - ./backend/assets:/app/assets
    command: ["node", "--watch", "src/server.js"]
    environment:
      NODE_ENV: development

  frontend:
    build:
      target: dev
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:3001}
    image: karaoke-frontend:dev
    pull_policy: never
    ports: !reset
      - "${FRONTEND_DEV_PORT:-8081}:8081"
    volumes: !reset
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:3001}
      EXPO_NO_TELEMETRY: "1"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
